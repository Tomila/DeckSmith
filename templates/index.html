<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="stylesheet" href="static/style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css" />
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <script>
        $(document).ready(function () {
            // Ensure the modal is hidden by default
            $('#product-modal').hide();

            // Open the modal when the 'Show Info' button is clicked
            $('.show-info-btn').on('click', function () {
                var productId = $(this).data('product-id');
                var productName = $(this).data('product-name');
                var productDescription = $(this).data('product-description');
                var productPrice = $(this).data('product-price');

                // Set the modal content dynamically
                $('#modal-product-name').text(productName);
                $('#modal-product-description').text(productDescription);
                $('#modal-product-price').text('$' + productPrice);

                // Display the modal
                $('#product-modal').fadeIn();
            });

            // Close the modal when the close button is clicked
            $('#close-modal').on('click', function () {
                $('#product-modal').fadeOut();
            });

            // Close the modal if clicking outside the modal content
            $('#product-modal').on('click', function (event) {
                if ($(event.target).is('#product-modal')) {
                    $('#product-modal').fadeOut();
                }
            });

            // Slick Slider for commercial banners
            $('.slider').slick({
                autoplay: true,
                autoplaySpeed: 3000,
                dots: true,
                arrows: false,
                fade: true
            });

            // Create a notification container
            const notificationContainer = $('<div id="notification-container"></div>').appendTo('body');

            // Function to show a self-closing notification
            function showNotification(message) {
                const notification = $('<div class="notification"></div>').text(message);
                notificationContainer.append(notification);
                notification.fadeIn(300);

                // Fade out and remove the notification after 3 seconds
                setTimeout(() => {
                    notification.fadeOut(300, () => {
                        notification.remove();
                    });
                }, 3000);
            }

            // Add to cart form submission
            document.querySelectorAll('.add-to-cart-form').forEach(form => {
                form.addEventListener('submit', async event => {
                    event.preventDefault();
                    const formData = new FormData(form);
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        showNotification('Item added to cart!');
                    } else {
                        showNotification('Failed to add item to cart.');
                    }
                });
            });
        });
    </script>
    <style>
        #notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .notification {
            background-color: #4caf50;
            color: white;
            padding: 10px 20px;
            margin: 5px 0;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            display: none; /* Initially hidden */
        }
    </style>
</head>

<body>
    <!-- Navigation Bar -->
    <nav>
        <div class="logo">
            <a href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Logo" class="logo-img">
            </a>
            <span class="site-name">DeckSmith</span>
        </div>
        <div class="announcement">
            <p>🎉</p>
        </div>
        <div class="actions">
            <div class="signin">
                <a href="{{ url_for('signin') }}">Sign In</a>
            </div>
            <div class="cart-indicator">
                <a href="{{ url_for('cart') }}">Cart</a>
            </div>
        </div>
    </nav>

    <!-- Commercial Slider Section -->
    <div class="slider">
        <div><img src="static/images/30off.jpg" alt="Banner 1"></div>
        <div><img src="static/images/free-shipping2.jpg" alt="Banner 2"></div>
        <div><img src="static/images/logo.jpg" alt="Banner 3"></div>
    </div>

    <!-- Featured Products Section -->
    <div class="featured-products">
        <h2>Featured Products</h2>
        <div class="product-grid">
            {% for product in products %}
            <div class="product">
                <img src="{{ url_for('static', filename='images/' + product['image']) }}" alt="{{ product['name'] }}">
                <h3>{{ product['name'] }}</h3>
                <p>${{ product['price'] }}</p>
                <form class="add-to-cart-form" action="{{ url_for('add_to_cart', product_id=product['id']) }}" method="POST">
                    <button type="submit">Add to Cart</button>
                </form>

                <!-- Show Info Button -->
                <button class="show-info-btn" 
                        data-product-id="{{ product['id'] }}"
                        data-product-name="{{ product['name'] }}"
                        data-product-description="{{ product['description'] }}"
                        data-product-price="{{ product['price'] }}">
                    Show Info
                </button>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Product Info Modal -->
    <div id="product-modal">
        <div class="modal-content">
            <span id="close-modal">&times;</span>
            <h3 id="modal-product-name"></h3>
            <p id="modal-product-description"></p>
            <p id="modal-product-price"></p>
        </div>
    </div>

    <!-- Footer with Navigation Bar -->
    <footer>
        <div class="footer-nav">
            <ul>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Privacy Policy</a></li>
                <li><a href="#">Terms of Service</a></li>
                <li><a href="#">FAQ</a></li>
            </ul>
        </div>
        <div class="social-links">
            <a href="https://www.tiktok.com/@yourusername" target="_blank" class="social-icon">
                <img src="path-to-your-tiktok-icon.png" alt="TikTok">
            </a>
            <a href="https://www.ebay.com/usr/yourusername" target="_blank" class="social-icon">
                <img src="path-to-your-ebay-icon.png" alt="eBay">
            </a>
        </div>
        <p>&copy; 2025 DeckSmith. All rights reserved.</p>
    </footer>
</body>

</html>
